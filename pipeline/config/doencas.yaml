# Configuração das doenças do VigiTrop.
#
# Cada doença aponta para um agravo do SINAN (código usado pelo PySUS) e define,
# em SQL (DuckDB), quais notificações entram em cada definição de caso.
#
# As expressões rodam sobre uma visão "normalizada" do arquivo bruto:
#   - toda coluna listada em `colunas_codigo` (comuns + extras da doença) vira
#     VARCHAR sem espaços nas pontas; vazio vira NULL.
#     Ex.: CLASSI_FIN '1 ' -> '1'; CLASSI_FIN 10 (inteiro) -> '10'.
#   - coluna que não existe no arquivo de um ano entra como NULL.
# Ou seja: compare sempre com texto ('1', '10'), nunca com número.
#
# `filtro`      recorte do arquivo antes de tudo (ex.: só acidentes com serpente).
# `definicoes`  nome -> expressão booleana. `confirmado` é obrigatória.
#               `provavel` só existe onde a distinção faz sentido.
#               `legado_tcc` reproduz a regra do TCC, para validação.
# `padrao`      qual definição o app usa por padrão. Se omitido: `confirmado`.
# `texto_app`   o que o app mostra sobre a contagem padrão (definição e ressalvas).
#
# STATUS: regras escritas a partir dos dicionários do SINAN (embutidos no
# PySUS 2.11.7) e do handoff. Todas conferidas contra a Tabela 1 do TCC nos
# anos com população conhecida (2010, 2015, 2020, 2022, 2024), em 01/11/2026.
# O comando `inspecionar` mostra as distribuições dessas colunas para conferir.
#
# Dados reais (catálogo do PySUS, 01/11/2026): TODAS as colunas vêm como
# VARCHAR, inclusive NU_ANO e SG_UF (código IBGE: '35'); datas vêm como
# 'AAAAMMDD'; CLASSI_FIN já vem sem espaço sobrando, mas há '' (vazio).
# CLASSI_FIN 8 (inconclusivo) aparece em RAIV e CHAG, embora não esteja
# no dicionário.

ano_inicio: 2007

# Denominador: projeção do IBGE, revisão 2024 (UF × sexo × idade simples,
# 2000-2070). É o mesmo do TCC (bate exato com `populacao_brasil` do dump).
populacao:
  url: https://ftp.ibge.gov.br/Projecao_da_Populacao/Projecao_da_Populacao_2024/projecoes_2024_tab1_idade_simples.xlsx

# Colunas da ficha de notificação, presentes (em princípio) em todos os agravos.
colunas_codigo_comuns:
  - NU_ANO       # ano da notificação
  - SEM_NOT      # semana epidemiológica da notificação (AAAASS)
  - SEM_PRI      # semana epidemiológica dos primeiros sintomas (AAAASS)
  - SG_UF        # UF de RESIDÊNCIA (código IBGE, 2 dígitos)
  - SG_UF_NOT    # UF de notificação (não usar para incidência)
  - ID_MN_RESI   # município de residência
  - NU_IDADE_N   # idade codificada: 1º dígito = unidade (1 h, 2 d, 3 m, 4 a)
  - CS_SEXO      # M, F, I
  - CS_RACA      # 1 branca, 2 preta, 3 amarela, 4 parda, 5 indígena, 9 ign.
  - CS_GESTANT
  - CLASSI_FIN
  - CRITERIO
  - EVOLUCAO

colunas_data_comuns:
  - DT_NOTIFIC
  - DT_SIN_PRI
  - DT_ENCERRA

doencas:

  dengue:
    codigo: DENG
    nome: Dengue
    texto_app: >
      Casos prováveis: todas as notificações, exceto as descartadas (critério do Ministério da Saúde).
    tabela_legada: dengue
    # Decisão (08/11/2026): padrão = casos prováveis (critério do Ministério e do TCC).
    padrao: provavel
    definicoes:
      # Classificação antiga (até 2013): 1 clássico, 2 com complicações,
      # 3 FHD, 4 SCD. Nova (2014+): 10 dengue, 11 com sinais de alarme,
      # 12 grave. Em 2014 aparecem as duas.
      confirmado: "CLASSI_FIN IN ('1','2','3','4','10','11','12')"
      # Ministério da Saúde: notificados menos descartados (5).
      # 13 = classificado como chikungunya: também sai.
      provavel: "CLASSI_FIN IS NULL OR CLASSI_FIN NOT IN ('5','13')"
      # TCC: todas as linhas do arquivo. 2010: 515,70 aqui contra 513,17 na
      # Tabela 1, enquanto os confirmados dão 446. A diferença bate com as
      # revisões que o DataSUS fez nos arquivos em 2026.
      legado_tcc: "TRUE"
    notas: >
      Os arquivos do DataSUS já vêm SEM os descartados (não há CLASSI_FIN 5),
      então "provável" é praticamente o arquivo inteiro.

  chikungunya:
    codigo: CHIK
    nome: Febre chikungunya
    texto_app: >
      Casos prováveis: todas as notificações, exceto as descartadas (critério do Ministério da Saúde).
    tabela_legada: febre_chikungunya
    # Decisão (08/11/2026): padrão = casos prováveis (critério do Ministério e do TCC).
    padrao: provavel
    definicoes:
      # 2014 até meados de 2016 (SINAN NET): 1 confirmado, 2 descartado,
      # 8 inconclusivo. Depois (SINAN online): 13 chikungunya, 5 descartado,
      # 10-12 dengue. Corrigido em 08/11/2026: antes, 2015 só confirmava 665
      # casos e o "provável" contava os descartados (2). Agora o provável de
      # 2015 dá 18,69 por 100 mil, e o Ministério publica 18,7
      # (docs/investigacao_definicoes.md, seção 2).
      confirmado: "CLASSI_FIN IN ('1','13')"
      provavel: "CLASSI_FIN IS NULL OR CLASSI_FIN NOT IN ('2','5','10','11','12')"
      # TCC, aproximado: em 2022, 70,47 aqui contra 70,58 na Tabela 1. Os
      # arquivos foram revisados em 2026, então não dá para conferir exato.
      legado_tcc: "CLASSI_FIN = '13'"
    notas: >
      O TCC (CLASSI_FIN 13) subestimava 2014-2016. O valor de 2015 no TCC
      (16,03) não sai de nenhuma combinação de códigos.

  chagas:
    codigo: CHAG
    nome: Doença de Chagas aguda
    texto_app: >
      Doença de Chagas aguda (o SINAN não registra a forma crônica). Casos confirmados, critério do Ministério da Saúde.
    tabela_legada: chagas
    # Decisão (08/11/2026): padrão = só confirmados, como conta o Ministério da
    # Saúde. O código 8 é encerramento automático por prazo, não diagnóstico
    # (docs/investigacao_definicoes.md, seção 1).
    definicoes:
      confirmado: "CLASSI_FIN = '1'"
      # Regra do TCC: confirmado + inconclusivo (8). Bate com a Tabela 1 em
      # 2010, 2015, 2020 e 2022 (verificado em 01/11/2026).
      legado_tcc: "CLASSI_FIN IN ('1','8')"
    notas: >
      O arquivo CHAG do SINAN é só de doença de Chagas AGUDA. O app antigo
      dizia apenas "Doença de Chagas". De 2007 a 2011 o arquivo só traz
      confirmados (CLASSI_FIN = 1 em todas as linhas); de 2012 em diante traz
      também suspeitos e descartados.

  esquistossomose:
    codigo: ESQU
    nome: Esquistossomose
    texto_app: >
      Todas as notificações (a notificação exige exame positivo). Em área endêmica, os casos de rotina são registrados no SISPCE, não no SINAN: os números refletem sobretudo áreas não endêmicas e formas graves.
    tabela_legada: esquistossomose
    colunas_codigo_extras: [FORMA, TPAUTOCTO]
    definicoes:
      # A ficha não tem CLASSI_FIN: notificação exige exame positivo.
      # Igual ao TCC: bate exato com a Tabela 1 em 2010, 2015 e 2020.
      confirmado: "TRUE"
    notas: >
      Em área endêmica os casos de rotina vão para o SISPCE, não para o SINAN.
      A incidência "Brasil" precisa de ressalva explícita no app.

  hanseniase:
    codigo: HANS
    nome: Hanseníase
    texto_app: >
      Casos novos (modo de entrada = caso novo), sem os encerrados por erro diagnóstico: o indicador oficial de detecção.
    tabela_legada: hanseniase
    colunas_codigo_extras: [MODOENTR, TPALTA_N, CLASSOPERA, FORMACLINI]
    colunas_data_extras: [DT_DIAG]
    definicoes:
      # Indicador oficial: casos novos (MODOENTR 1), sem "erro diagnóstico"
      # na saída (TPALTA_N 8). 2019: 28.337 aqui; o Ministério divulga ~27,9 mil.
      confirmado: "MODOENTR = '1' AND (TPALTA_N IS NULL OR TPALTA_N <> '8')"
      # TCC: todas as notificações, sem filtro de caso novo. Bate exato com a
      # Tabela 1 em 2010, 2015 e 2020. Infla a detecção em ~30% (2019:
      # 36.626 contra 28.337).
      legado_tcc: "TRUE"
    notas: >
      O Ministério da Saúde usa o ano de diagnóstico (DT_DIAG).

  leishmaniose_visceral:
    codigo: LEIV
    nome: Leishmaniose visceral
    texto_app: >
      Casos confirmados, critério do Ministério da Saúde.
    tabela_legada: leishmaniose_visceral
    colunas_codigo_extras: [ENTRADA]
    # Decisão (08/11/2026): padrão = só confirmados, como conta o Ministério da
    # Saúde. O código 8 é encerramento automático por prazo, não diagnóstico
    # (docs/investigacao_definicoes.md, seção 1).
    definicoes:
      confirmado: "CLASSI_FIN = '1'"
      provavel: "CLASSI_FIN IS NULL OR CLASSI_FIN <> '2'"
      # Regra do TCC: confirmado + inconclusivo (8). Bate exato com a
      # Tabela 1 em 2010, 2015, 2020 e 2022.
      legado_tcc: "CLASSI_FIN IN ('1','8')"
    notas: >
      ENTRADA: 1 caso novo, 2 recidiva, 3 transferência. Decidir se
      transferências saem da contagem (evita contar o mesmo caso duas vezes).

  leishmaniose_tegumentar:
    codigo: LTAN
    nome: Leishmaniose tegumentar americana
    texto_app: >
      Todas as notificações (só casos confirmados são notificados).
    tabela_legada: leishmaniose_tegumentar
    colunas_codigo_extras: [CLA_TIPO_N, CLAS_FORMA]
    definicoes:
      # A ficha não tem CLASSI_FIN: só casos confirmados são notificados.
      # Igual ao TCC: bate exato com a Tabela 1 em 2010, 2015, 2020 e 2022.
      confirmado: "TRUE"
    notas: >
      CLA_TIPO_N: 1 caso novo, 2 recidiva, 3 transferência. Mesma decisão
      da leishmaniose visceral.

  envenenamento_serpente:
    codigo: ANIM
    nome: Envenenamento por picada de cobra
    texto_app: >
      Envenenamento por serpente: acidentes com serpentes peçonhentas ou de tipo não identificado. Picadas de serpente não peçonhenta ficam de fora, porque não causam envenenamento (a DTN da OMS é snakebite envenoming).
    tabela_legada: envenenamento_picada
    colunas_codigo_extras: [TP_ACIDENT, ANI_SERPEN, TRA_CLASSI]
    # O arquivo ANIM tem todos os animais peçonhentos: fica só serpente.
    filtro: "TP_ACIDENT = '1'"
    definicoes:
      # Decisão (08/11/2026): sem serpente não peçonhenta (5), que não causa
      # envenenamento; a DTN da OMS é snakebite envenoming. O tipo ignorado
      # (9) fica: 41% receberam soro e houve 223 óbitos.
      confirmado: "ANI_SERPEN IS NULL OR ANI_SERPEN <> '5'"
      # TCC, aproximado: só serpentes peçonhentas de tipo conhecido
      # (botrópico, crotálico, elapídico, laquético). Fica a ±3% da Tabela 1;
      # os arquivos foram revisados em 2025 e 2026.
      legado_tcc: "ANI_SERPEN IN ('1','2','3','4')"
    notas: >
      ANI_SERPEN 5 = não peçonhenta; 9 = tipo ignorado. Em 2010: todas as
      serpentes 15,41/100 mil; sem as não peçonhentas 14,79; só peçonhentas
      de tipo conhecido (regra do TCC) 13,09.

  raiva_humana:
    codigo: RAIV
    nome: Raiva humana
    texto_app: >
      Casos confirmados, critério do Ministério da Saúde. São de 1 a 11 casos por ano: a incidência fica na casa de 0,00x por 100 mil.
    tabela_legada: raiva_humana
    # Decisão (08/11/2026): padrão = só confirmados, como conta o Ministério da
    # Saúde. O código 8 é encerramento automático por prazo, não diagnóstico
    # (docs/investigacao_definicoes.md, seção 1).
    definicoes:
      confirmado: "CLASSI_FIN = '1'"
      # Regra do TCC: confirmado + inconclusivo (8), como no README antigo.
      # Bate com a Tabela 1 em 2010, 2015 e 2020 (verificado em 01/11/2026).
      # Dá de 10 a 20 vezes os confirmados: em 2018, 66 contra 11.
      legado_tcc: "CLASSI_FIN IN ('1','8')"
    notas: >
      Confirmados: de 1 a 11 por ano. Mostrar casos, não taxa. O README antigo
      também descartava linhas sem NU_IDADE_N.
